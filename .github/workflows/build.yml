name: build

on: [pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with: { node-version: 22.x }
      - name: Enable Corepack
        run: corepack enable
      - name: Build
        run: |
          yarn install --frozen-lockfile
          yarn build
